<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дедлайны — учебные задания</title>
<style>
:root{--ink:#1c2333;--mute:#667085;--bg:#eef1f6;--surf:#fff;--line:#d9dfea;--acc:#2f4bff;--bad:#d93a3a;--ok:#1f8f5f;--warn:#b86b00;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.adm-only{display:none!important}
body.adm .adm-only{display:revert!important}
body.adm .topb.adm-only,body.adm .acts.adm-only{display:flex!important}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;max-width:1100px;margin:0 auto}
aside{padding:24px 16px;border-right:1px solid var(--line)}
h1{font-size:22px;margin:0 0 20px;letter-spacing:-.01em}
.subj{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left}
.subj:hover{background:#e2e7f1}
.subj.on{background:var(--surf);font-weight:600;box-shadow:inset 3px 0 0 var(--c,var(--acc))}
.subj i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--mute));flex:none}
.subj b{margin-left:auto;font-weight:500;color:var(--mute);font-size:13px}
.addsubj{display:flex;gap:6px;margin-top:14px}
.addsubj input{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surf)}
.btn{border:1px solid var(--line);background:var(--surf);padding:8px 12px;border-radius:8px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.bad{color:var(--bad)}
.foot{margin-top:24px;font-size:13px;color:var(--mute)}
.link{border:0;background:none;padding:0;text-decoration:underline;color:var(--mute)}
main{padding:24px 24px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px}
.topb{display:flex;gap:8px}
.grp{margin-top:26px}
.grp h3{margin:0 0 8px;font-size:14px;color:var(--mute);font-weight:600}
.grp.bad h3{color:var(--bad)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surf);padding:12px 14px 12px 12px;border-left:4px solid var(--c);border-radius:4px 10px 10px 4px;margin-bottom:8px}
.task.done{opacity:.55}
.task.done .tt{text-decoration:line-through}
.chk{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}
.tt{font-weight:600}
.meta{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.due.bad{color:var(--bad);font-weight:600}.due.soon{color:var(--warn);font-weight:600}
.note{font-size:14px;margin-top:6px;white-space:pre-wrap}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.file{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;font-size:13px;background:#f7f9fc}
.file button{border:0;background:none;padding:3px 9px}
.file .x{color:var(--mute);padding-left:2px}
.acts{display:flex;gap:4px}
.ico{border:0;background:none;padding:4px 8px;border-radius:6px;color:var(--mute);font-size:13px}
.ico:hover{background:var(--bg);color:var(--ink)}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:14px;padding:22px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(20,30,60,.3)}
dialog::backdrop{background:rgba(20,30,60,.4)}
dialog h2{margin:0 0 14px;font-size:18px}
dialog p{font-size:13px;color:var(--mute);margin:0 0 4px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;display:none;max-width:92vw;z-index:10}
.topics{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.tp-toggle{background:none;border:0;padding:4px 0;font:inherit;font-size:13px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:6px;width:100%;text-align:left;font-weight:500}
.tp-toggle:hover{color:var(--ink)}
.tp-toggle .chev{margin-left:auto;font-size:14px;color:var(--mute);line-height:1}
.tp-list{margin-top:2px}
.tp{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.tp-t{flex:1}
.tp.taken .tp-t{color:var(--mute)}
.tp-n{font-size:13px;color:var(--ok);font-weight:600}
.tp .btn{padding:4px 10px;font-size:13px}
#stbl{width:100%;border-collapse:collapse;font-size:14px}
#stbl th,#stbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
#stbl th{color:var(--mute);font-weight:600;font-size:13px}
#stbl td.free{color:var(--mute)}#stbl td.ok{font-weight:600;color:var(--ok)}
@media(max-width:760px){
.app{grid-template-columns:1fr}
aside{border-right:0;border-bottom:1px solid var(--line);padding:14px 12px}
h1{font-size:19px;margin:0 0 12px}
#subjs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.subj{width:auto;white-space:nowrap;background:var(--surf);padding:8px 12px;font-size:14px}
.subj b{font-size:12px;margin-left:6px}
main{padding:14px 12px 60px}
.top{margin-bottom:6px}
.top h2{font-size:17px}
.topb{width:100%;flex-wrap:wrap;gap:6px}
.topb .btn{flex:1 1 auto;padding:9px 10px;font-size:14px;text-align:center}
.grp{margin-top:20px}
.grp h3{font-size:13px}
.task{grid-template-columns:auto 1fr;padding:10px 12px;gap:10px;margin-bottom:8px}
.chk{width:22px;height:22px}
.acts{grid-column:1/-1;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.acts .ico{padding:6px 10px;font-size:13px}
.tt{font-size:15px}
.meta{font-size:12px;gap:2px 10px}
.note{font-size:13px}
.file{font-size:12px}
.file button{padding:4px 10px}
.tp-toggle{font-size:13px;padding:6px 0}
.tp{font-size:13px;padding:6px 0}
.tp .btn{padding:6px 12px;font-size:13px}
.tp-n{font-size:12px}
dialog{padding:18px;width:min(460px,94vw)}
dialog input,dialog select,dialog textarea{padding:10px;font-size:16px}
.row{gap:6px;margin-top:14px}
.row .btn{padding:10px 14px;flex:1 1 auto}
#toast{font-size:13px;padding:8px 14px;bottom:12px}
#stbl{font-size:13px}
#stbl th,#stbl td{padding:5px 6px}
}
@media(max-width:400px){
.topb .btn{font-size:13px;padding:8px}
.subj{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Дедлайны</h1>
  <div id="subjs"></div>
  <div class="adm-only"><form class="addsubj" id="sf"><input id="sn" placeholder="Новая дисциплина" aria-label="Название дисциплины" maxlength="60"><button class="btn">Добавить</button></form></div>
  <div class="foot">
    <span class="adm-only">Режим администратора. <button class="link" id="logout">Выйти</button></span>
    <button class="link" id="login">Вход для администратора</button>
  </div>
</aside>
<main>
  <div class="top"><h2 id="ttl">Все дисциплины</h2>
   <div class="topb adm-only"><button class="btn" id="sumbtn">Сводка броней</button><button class="btn" id="apibtn">Бронирование</button><button class="btn" id="rensubj" hidden>Переименовать</button><button class="btn bad" id="delsubj" hidden>Удалить дисциплину</button><button class="btn pri" id="new">Добавить задание</button></div></div>
  <div id="list"></div>
</main>
</div>

<dialog id="dlg">
<form method="dialog" id="tf">
  <h2 id="dh">Новое задание</h2>
  <label for="f-t">Что нужно сделать</label><input id="f-t" required maxlength="140">
  <label for="f-s">Дисциплина</label><select id="f-s" required></select>
  <label for="f-d">Срок сдачи</label><input id="f-d" type="datetime-local">
  <label for="f-n">Заметка</label><textarea id="f-n" rows="3"></textarea>
  <label for="f-p">Темы для бронирования (по одной в строке, необязательно)</label><textarea id="f-p" rows="4"></textarea>
  <label for="f-f">Файлы к заданию</label><input id="f-f" type="file" multiple>
  <div class="row"><button class="btn" type="button" id="cancel">Отмена</button><button class="btn pri" type="submit" id="dsub">Опубликовать</button></div>
</form>
</dialog>

<dialog id="adlg">
<form method="dialog" id="af">
  <h2>Вход для администратора</h2>
  <p>Токен сохраняется только в этом браузере.</p>
  <label for="a-b">Аккаунт GitHub (владелец репозитория)</label><input id="a-b" required autocomplete="off">
  <label for="a-k">Название репозитория</label><input id="a-k" required autocomplete="off">
  <label for="a-s">Токен доступа</label><input id="a-s" type="password" required autocomplete="off">
  <div class="row"><button class="btn" type="button" id="acancel">Отмена</button><button class="btn pri" type="submit">Войти</button></div>
</form>
</dialog>

<dialog id="sdlg" style="width:min(860px,94vw)">
  <h2>Сводка броней</h2>
  <div style="overflow:auto;max-height:60vh"><table id="stbl"><thead><tr><th>Дисциплина</th><th>Задание</th><th>Тема</th><th>Занял(а)</th></tr></thead><tbody id="sbody"></tbody></table></div>
  <div class="row"><button class="btn" type="button" id="scsv">Скачать для Excel</button><button class="btn pri" type="button" id="sclose">Закрыть</button></div>
</dialog>

<div id="toast" role="status"></div>
<input type="file" id="addf" multiple hidden>

<script>
const COLORS=["#2f4bff","#d9534f","#1f8f5f","#b86b00","#8a3ffc","#0b8aa6","#c2185b","#5d6b82"];
const MAXF=25*1024*1024;

/* ====== НАСТРОЙКИ SUPABASE ====== */
const SB_URL="https://xmbanshmxcmylvjsrgol.supabase.co";
const SB_KEY="sb_publishable_AOPVaQq28i30ZBLNtw289g_mSVZWj5v";

let S={subjects:[],tasks:[]},cur="all",cfg=null,attachTo=null,loaded=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let DONE=new Set(ls.get("dl-done",[]));
function toast(t,ms=3500){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>e.style.display="none",ms)}

/* ---- запись через GitHub API ---- */
const enc=new TextEncoder();
const gh=(m,p,b)=>fetch(`https://api.github.com/repos/${cfg.o}/${cfg.r}/contents/${p}`,{method:m,headers:{Authorization:"Bearer "+cfg.t,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:b?JSON.stringify(b):undefined});
const b64s=b=>{let s="";for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)};
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});
async function shaOf(p){const r=await gh("GET",p);if(r.status===404)return undefined;if(!r.ok)throw new Error("HTTP "+r.status);return(await r.json()).sha}
async function put(p,b64){const body={message:"update "+p,content:b64},s=await shaOf(p);if(s)body.sha=s;const r=await gh("PUT",p,body);if(!r.ok)throw new Error("HTTP "+r.status)}
async function delFile(p){const s=await shaOf(p);if(!s)return;const r=await gh("DELETE",p,{message:"delete "+p,sha:s});if(!r.ok)throw new Error("HTTP "+r.status)}
const putFile=async(p,f)=>put(p,await fileB64(f));
const publish=()=>put("data.json",b64s(enc.encode(JSON.stringify(S))));
async function pull(){const r=await gh("GET","data.json");
 if(r.status===404){S={subjects:[],tasks:[]};loaded=true;return}
 if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
 S=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")),c=>c.charCodeAt(0))));loaded=true}
function errMsg(e){return e instanceof TypeError?"Нет связи с GitHub — проверьте интернет":
 /401/.test(e.message)?"Ошибка 401 — токен неверный или просрочен":
 /40[34]/.test(e.message)?"Ошибка "+e.message.slice(5)+" — нет прав на запись или репозиторий не найден":"Не удалось опубликовать ("+e.message+")"}
async function run(fn){toast("Публикую…",0);try{await fn();await publish();render();toast("Опубликовано. У остальных появится примерно через минуту",5000)}catch(e){toast(errMsg(e),6000)}}

/* ---- загрузка данных ---- */
async function loadData(){
 try{const r=await fetch("data.json?"+Date.now(),{cache:"no-store"});
  if(r.ok)S=await r.json();else if(r.status!==404)throw 0;
  loaded=true}catch(e){$("#list").innerHTML='<div class="empty">Не удалось загрузить задания. Откройте сайт по ссылке с хостинга, а не как файл с компьютера.</div>';return false}
 return true}

/* ---- даты ---- */
const tm=d=>d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
const fmt=d=>new Date(d).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
function dueInfo(t){
 if(!t.due)return{g:"nodue",txt:"без срока",cls:""};
 const now=new Date(),d=new Date(t.due),d0=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()),dd=Math.round((d0(d)-d0(now))/864e5);
 if(d<now)return{g:"over",txt:"просрочено · "+fmt(t.due),cls:"bad"};
 if(dd===0)return{g:"today",txt:"сегодня · "+tm(d),cls:"soon"};
 if(dd===1)return{g:"week",txt:"завтра · "+tm(d),cls:"soon"};
 return{g:dd<=7?"week":"later",txt:fmt(t.due)+" (через "+dd+" дн.)",cls:""}}
const GROUPS=[["over","Просрочено","bad"],["today","Сегодня",""],["week","Ближайшая неделя",""],["later","Позже",""],["nodue","Без срока",""],["done","Сделано",""]];
const size=n=>n>1048576?(n/1048576).toFixed(1)+" МБ":Math.max(1,Math.round(n/1024))+" КБ";

function render(){
 document.body.classList.toggle("adm",!!cfg);
 $("#login").hidden=!!cfg;
 const cnt=id=>S.tasks.filter(t=>!DONE.has(t.id)&&(id==="all"||t.subj===id)).length;
 if(cur!=="all"&&!S.subjects.some(s=>s.id===cur))cur="all";
 $("#subjs").innerHTML=`<button class="subj ${cur==="all"?"on":""}" data-s="all"><i></i>Все дисциплины<b>${cnt("all")}</b></button>`+
  S.subjects.map(s=>`<button class="subj ${cur===s.id?"on":""}" data-s="${s.id}" style="--c:${s.c}"><i></i>${esc(s.name)}<b>${cnt(s.id)}</b></button>`).join("");
 const sub=S.subjects.find(s=>s.id===cur);
 $("#ttl").textContent=sub?sub.name:"Все дисциплины";$("#delsubj").hidden=!sub;$("#rensubj").hidden=!sub;
 const by={};GROUPS.forEach(g=>by[g[0]]=[]);
 S.tasks.filter(t=>cur==="all"||t.subj===cur).forEach(t=>{const i=dueInfo(t);by[DONE.has(t.id)?"done":i.g].push({t,i})});
 for(const k in by)by[k].sort((a,b)=>(a.t.due||"9")<(b.t.due||"9")?-1:1);
 let h="";
 for(const[k,name,cls]of GROUPS){if(!by[k].length)continue;
  h+=`<section class="grp ${cls}"><h3>${name} · ${by[k].length}</h3>`+by[k].map(({t,i})=>{
   const s=S.subjects.find(x=>x.id===t.subj)||{name:"—",c:"#999"},dn=DONE.has(t.id);
   return `<article class="task ${dn?"done":""}" style="--c:${s.c}">
   <input type="checkbox" class="chk" data-done="${t.id}" ${dn?"checked":""} aria-label="Отметить выполненным">
   <div><div class="tt">${esc(t.title)}</div>
    <div class="meta"><span>${esc(s.name)}</span><span class="due ${dn?"":i.cls}">${i.txt}</span></div>
    ${t.note?`<div class="note">${esc(t.note)}</div>`:""}
    <div class="files">${t.files.map(f=>`<span class="file"><button data-open="${t.id}|${f.id}" title="Скачать">${esc(f.name)} · ${size(f.size)}</button><button class="x adm-only" data-rm="${t.id}|${f.id}" aria-label="Удалить файл">×</button></span>`).join("")}</div>
    ${topicsHtml(t)}
   </div>
   <div class="acts adm-only"><button class="ico" data-edit="${t.id}">Изменить</button><button class="ico" data-att="${t.id}">+ файл</button><button class="ico" data-del="${t.id}">Удалить</button></div>
  </article>`}).join("")+`</section>`}
 $("#list").innerHTML=h||`<div class="empty">${cfg?"Добавьте дисциплину слева, затем первое задание.":"Заданий пока нет."}</div>`;
}

/* ---- бронирование тем (Supabase) ---- */
let BK=[],bkErr=false,mine=ls.get("dl-mine",{}),EXPANDED=new Set(ls.get("dl-expanded",[]));
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");

function topicsHtml(t){
 if(!t.topics||!t.topics.length)return"";
 const on=!!SB_URL&&!bkErr;
 const free=t.topics.filter(p=>!BK.some(b=>b.task===t.id&&b.topic===p.id)).length;
 const myTopic=t.topics.find(p=>mine[t.id+"|"+p.id]);
 let note;
 if(myTopic)note=" · вы заняли: "+esc(myTopic.text);
 else if(!SB_URL)note=" · бронирование пока не настроено";
 else if(bkErr)note=" · бронирование сейчас недоступно";
 else note=" · свободно "+free+" из "+t.topics.length;
 const open=EXPANDED.has(t.id);
 const list=open?`<div class="tp-list">`+t.topics.map(p=>{
  const k=t.id+"|"+p.id,b=BK.find(x=>x.task===t.id&&x.topic===p.id);let r="";
  if(b)r=`<span class="tp-n">${esc(b.name)}</span>`+(mine[k]?`<button class="ico" data-unbook="${k}">Отменить</button>`:`<button class="ico adm-only" data-unbook="${k}">Освободить</button>`);
  else if(on)r=`<button class="btn" data-book="${k}">Занять</button>`;
  return `<div class="tp ${b?"taken":""}"><span class="tp-t">${esc(p.text)}</span>${r}</div>`}).join("")+`</div>`:"";
 return `<div class="topics"><button class="tp-toggle" data-toggle-topics="${t.id}"><span>Темы${note}</span><span class="chev">${open?"▾":"▸"}</span></button>${list}</div>`}

async function loadBookings(){
 if(!SB_URL||!SB_KEY)return;
 try{
  const r=await fetch(SB_URL+"/rest/v1/rpc/list_bookings",{
   method:"POST",
   headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},
   body:"{}"
  });
  if(!r.ok)throw 0;
  BK=await r.json();
  bkErr=false
 }catch(e){bkErr=true}
 render()}

async function book(tid,pid){
 let name=prompt("Ваши фамилия и имя (так их увидит группа)",ls.get("dl-name",""));name=(name||"").trim().replace(/\s+/g," ");
 if(name.length<2)return;ls.set("dl-name",name);const owner=rnd();
 try{
  const r=await fetch(SB_URL+"/rest/v1/rpc/book_topic",{
   method:"POST",
   headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({p_task:tid,p_topic:pid,p_name:name,p_owner:owner})
  });
  const result=await r.json().catch(()=>"");
  if(result==="ok"){
   mine[tid+"|"+pid]=owner;ls.set("dl-mine",mine);
   EXPANDED.add(tid);ls.set("dl-expanded",[...EXPANDED]);
   toast("Тема за вами")
  }
  else if(result==="taken")toast("Эту тему уже заняли")
  else if(result==="has_other")toast("Вы уже заняли другую тему в этом задании")
  else if(result==="bad_request")toast("Проверьте введённые данные")
  else toast("Не удалось занять тему")
 }catch(e){toast("Сервис бронирования недоступен")}
 loadBookings()}

async function unbook(k){
 const[tid,pid]=k.split("|"),body={p_task:tid,p_topic:pid};
 if(mine[k])body.p_owner=mine[k];
 else{let ak=ls.get("dl-akey","");if(!ak){ak=(prompt("Ключ администратора бронирования")||"").trim();if(!ak)return}body.p_admin=ak}
 try{
  const r=await fetch(SB_URL+"/rest/v1/rpc/unbook_topic",{
   method:"POST",
   headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},
   body:JSON.stringify(body)
  });
  const result=await r.json().catch(()=>"");
  if(result==="ok"){delete mine[k];ls.set("dl-mine",mine);if(body.p_admin)ls.set("dl-akey",body.p_admin);toast("Бронь снята")}
  else if(result==="forbidden"){if(body.p_admin)ls.del("dl-akey");toast("Нет прав снять эту бронь")}
  else toast("Не удалось снять бронь")
 }catch(e){toast("Сервис бронирования недоступен")}
 loadBookings()}

$("#apibtn").onclick=()=>{
 toast("Бронирование работает через Supabase. Настраивать ничего не нужно.",4000)};

/* ---- сводка броней ---- */
function sumRows(){const rows=[];S.tasks.forEach(t=>(t.topics||[]).forEach(p=>{
 const b=BK.find(x=>x.task===t.id&&x.topic===p.id),s=S.subjects.find(x=>x.id===t.subj);
 rows.push([s?s.name:"—",t.title,p.text,b?b.name:""])}));return rows}
$("#sumbtn").onclick=async()=>{await loadBookings();const r=sumRows();
 $("#sbody").innerHTML=r.length?r.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td class="${x[3]?"ok":"free"}">${x[3]?esc(x[3]):"свободно"}</td></tr>`).join(""):'<tr><td colspan="4">Тем для бронирования пока нет</td></tr>';
 $("#sdlg").showModal()};
$("#sclose").onclick=()=>$("#sdlg").close();
$("#scsv").onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[["Дисциплина","Задание","Тема","Занял(а)"],...sumRows()];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="bronirovanie.csv";a.click()};

/* ---- действия ---- */
async function openFile(m){try{const r=await fetch("files/"+m.id);if(!r.ok)throw 0;const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download=m.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){toast("Не удалось скачать файл")}}
async function upload(t,files){for(const f of files){
 if(f.size>MAXF){toast("«"+f.name+"» больше 25 МБ — пропущен");continue}
 const id=uid();await putFile("files/"+id,f);t.files.push({id,name:f.name,size:f.size})}}

document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset,T=id=>S.tasks.find(t=>t.id===id);
 if(d.s){cur=d.s;render();return}
 if(d.toggleTopics){
  const id=d.toggleTopics;
  if(EXPANDED.has(id))EXPANDED.delete(id);else EXPANDED.add(id);
  ls.set("dl-expanded",[...EXPANDED]);
  render();return;
 }
 if(d.edit)openForm(T(d.edit));
 if(d.book){const[a,b]=d.book.split("|");book(a,b)}
 if(d.unbook)unbook(d.unbook);
 if(d.open){const[t,f]=d.open.split("|");openFile(T(t).files.find(x=>x.id===f))}
 if(d.att){attachTo=T(d.att);$("#addf").click()}
 if(d.rm){const[t,f]=d.rm.split("|"),tk=T(t);if(confirm("Удалить файл?"))run(async()=>{try{await delFile("files/"+f)}catch(x){}tk.files=tk.files.filter(x=>x.id!==f)})}
 if(d.del){const tk=T(d.del);if(confirm("Удалить «"+tk.title+"» вместе с файлами?"))run(async()=>{for(const f of tk.files){try{await delFile("files/"+f.id)}catch(x){}}S.tasks=S.tasks.filter(x=>x!==tk)})}
});
document.addEventListener("change",e=>{const id=e.target.dataset.done;if(!id)return;e.target.checked?DONE.add(id):DONE.delete(id);ls.set("dl-done",[...DONE]);render()});
$("#addf").onchange=e=>{const fl=[...e.target.files],t=attachTo;e.target.value="";if(t&&fl.length)run(()=>upload(t,fl))};
$("#sf").onsubmit=e=>{e.preventDefault();const n=$("#sn").value.trim();if(!n)return;
 S.subjects.push({id:uid(),name:n,c:COLORS[S.subjects.length%COLORS.length]});$("#sn").value="";run(async()=>{})};
$("#rensubj").onclick=()=>{const s=S.subjects.find(x=>x.id===cur);if(!s)return;
 const n=(prompt("Новое название дисциплины",s.name)||"").trim();if(!n||n===s.name)return;run(async()=>{s.name=n})};
$("#delsubj").onclick=()=>{const s=S.subjects.find(x=>x.id===cur);if(!s||!confirm("Удалить дисциплину «"+s.name+"» и все её задания?"))return;
 run(async()=>{for(const t of S.tasks.filter(t=>t.subj===s.id))for(const f of t.files){try{await delFile("files/"+f.id)}catch(x){}}
  S.tasks=S.tasks.filter(t=>t.subj!==s.id);S.subjects=S.subjects.filter(x=>x!==s);cur="all"})};
let editing=null;
function openForm(t){
 if(!S.subjects.length){toast("Сначала добавьте дисциплину слева");return}
 editing=t;$("#tf").reset();
 $("#f-s").innerHTML=S.subjects.map(s=>`<option value="${s.id}" ${s.id===(t?t.subj:cur)?"selected":""}>${esc(s.name)}</option>`).join("");
 $("#dh").textContent=t?"Изменить задание":"Новое задание";$("#dsub").textContent=t?"Сохранить":"Опубликовать";
 if(t){$("#f-t").value=t.title;$("#f-d").value=t.due||"";$("#f-n").value=t.note||"";$("#f-p").value=(t.topics||[]).map(x=>x.text).join("\n")}
 $("#dlg").showModal();$("#f-t").focus()}
$("#new").onclick=()=>openForm(null);
$("#cancel").onclick=()=>$("#dlg").close();
$("#tf").onsubmit=()=>{
 const v={title:$("#f-t").value.trim(),subj:$("#f-s").value,due:$("#f-d").value,note:$("#f-n").value.trim(),topics:$("#f-p").value.split("\n").map(s=>s.trim()).filter(Boolean).map(x=>((editing&&editing.topics)||[]).find(o=>o.text===x)||{id:uid(),text:x})},fl=[...$("#f-f").files],t=editing||{id:uid(),files:[]};
 run(async()=>{Object.assign(t,v);await upload(t,fl);if(!editing)S.tasks.push(t)})};

/* ---- вход админа ---- */
$("#login").onclick=()=>{if(!loaded){toast("Сначала нужно открыть сайт по ссылке с хостинга");return}$("#adlg").showModal()};
$("#acancel").onclick=()=>$("#adlg").close();
$("#af").onsubmit=async()=>{
 cfg={o:$("#a-b").value.trim(),r:$("#a-k").value.trim(),t:$("#a-s").value.trim()};
 toast("Проверяю доступ…",0);
 try{await pull();await publish();ls.set("dl-admin",cfg);render();toast("Вы вошли как администратор")}catch(e){cfg=null;render();toast(errMsg(e),6000)}};
$("#logout").onclick=()=>{cfg=null;ls.del("dl-admin");render()};

cfg=ls.get("dl-admin",null);
(cfg?pull().catch(loadData):loadData()).then(()=>{render();loadBookings()});
setInterval(()=>{if(SB_URL)loadBookings()},30000);
</script>
